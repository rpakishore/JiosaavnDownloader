[paths]
db_folder='''.'''   # This is folder where songs.jsonl file is stored
destination='''.''' # This is folder where music will be stored

[gotify]
url='https://gotify.example.com'  # Gotify server url
app_key=''  # Gotify app token. Leave url/app_key empty to use the env vars GOTIFY_URL / GOTIFY_TOKEN instead

[schedule]
playlists=[]  # Playlist ids downloaded by `app sync` (used by scripts/weekly.sh), e.g. ['109815423', '799619460']
